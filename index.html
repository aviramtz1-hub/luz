<style>
  :root {

  * { box-sizing: border-box; }

  header { flex-wrap: nowrap; gap: 6px; } header h1 { font-size: 19px; line-height: 1.15; min-width: 0; }

  .b3 { display: grid; grid-template-columns: 1fr 1.4fr 1.6fr; gap: 8px; } .form input, .form select { width: 100%; min-width: 0; }

  details.ms > summary::-webkit-details-marker { display: none; }

  details.ms .ms-l { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; background: var(--card); }
  details.ms .ms-l label.fam { flex-basis: 100%; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
  details.ms .ms-l label { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; font-size: 16px; color: var(--ink); }

  .item { display: block; width: 100%; text-align: right; background: none; border: 0; padding: 3px 0; cursor: pointer; line-height: 1.35; color: inherit; }
  .item:hover { background: #f1f1ee; }
  .item .who { font-weight: 700; }
  .item .t { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .item.one { background: var(--star-bg); border-radius: 6px; padding: 3px 5px; margin: 2px 0; }
  .item.one::before { content: "★ "; color: var(--star); }
  #btnUndo:disabled { opacity: .35; cursor: default; }
  .item.off { text-decoration: line-through; color: var(--muted); }
  .item.busy-edit, .item.busy-del { position: relative; border-radius: 8px; animation: busyGlow 1.2s ease-in-out infinite; background: linear-gradient(100deg, transparent 30%, var(--busy-sh) 50%, transparent 70%) 0 0/250% 100% no-repeat, var(--busy-bg); }
  .item.busy-edit { --busy: #f08c00; --busy-bg: rgba(240,140,0,.08); --busy-sh: rgba(240,140,0,.28); }
  .item.busy-del  { --busy: #e03131; --busy-bg: rgba(224,49,49,.07); --busy-sh: rgba(224,49,49,.25); }
  @keyframes busyGlow { 0% { box-shadow: 0 0 0 1.5px var(--busy); background-position: 130% 0, 0 0; } 50% { box-shadow: 0 0 0 3px var(--busy), 0 0 10px var(--busy); } 100% { box-shadow: 0 0 0 1.5px var(--busy); background-position: -30% 0, 0 0; } }
  @media (prefers-reduced-motion: reduce) { .item.busy-edit, .item.busy-del { animation: none; box-shadow: 0 0 0 2px var(--busy); } }
  .empty { color: var(--muted); font-size: 13px; }
  #splash { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .25s; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .dots { position: relative; width: 106px; height: 60px; direction: ltr; }
  #splash .dots i { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; will-change: transform; }
  #splash .dots i:nth-child(1) { transform: translate(0px,0px); background: var(--accent); }
  #splash .dots i:nth-child(2) { transform: translate(44px,0px); background: #e0709b; }
  #splash .dots i:nth-child(3) { transform: translate(88px,0px); background: #5aa469; }
  #splash .dots i:nth-child(4) { transform: translate(22px,42px); background: #f2b134; }
  #splash .dots i:nth-child(5) { transform: translate(66px,42px); background: #8a4b2a; }
  #splash .dots.pre i { animation: hop 3s ease-in-out infinite; }
  #splash .dots.pre i:nth-child(1) { animation-delay: 0s; } #splash .dots.pre i:nth-child(2) { animation-delay: -2.4s; } #splash .dots.pre i:nth-child(3) { animation-delay: -1.8s; } #splash .dots.pre i:nth-child(4) { animation-delay: -1.2s; } #splash .dots.pre i:nth-child(5) { animation-delay: -.6s; }
  @keyframes hop { 0% { transform: translate(0,0); } 16% { transform: translate(44px,0); } 20% { transform: translate(44px,0); } 36% { transform: translate(88px,0); } 40% { transform: translate(88px,0); } 56% { transform: translate(22px,42px); } 60% { transform: translate(22px,42px); } 76% { transform: translate(66px,42px); } 80% { transform: translate(66px,42px); } 90% { transform: translate(44px,-16px); } 100% { transform: translate(0,0); } }
  #splash .sname { color: var(--muted); font-size: 15px; }
  #busyDlg { border: 0; padding: 0; background: transparent; width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; overflow: hidden; outline: none; }
  #busyDlg::backdrop { background: rgba(246,245,242,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  .dots { position: relative; width: 106px; height: 60px; direction: ltr; }
  .dots i { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; will-change: transform; }
  .dots i:nth-child(1) { background: var(--accent); }
  .dots i:nth-child(2) { background: #e0709b; }
  .dots i:nth-child(3) { background: #5aa469; }
  .dots i:nth-child(4) { background: #f2b134; }
  .dots i:nth-child(5) { background: #8a4b2a; }
  .btn.crimson { background: #a3173a; border-color: #a3173a; color: #fff; font-weight: 500; }


  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(440px, calc(100vw - 32px)); }

  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 9mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { background: #fff; }
    .app, dialog, .mic, .listening { display: none !important; }
    #print { display: block; }

    /* ---- theme variables (default = excel) ---- */
    #print { --b1: #8fd3f4; --b2: #fbd3b0; --b3: #c4e5b5; --b4: #fbe8a0; --ink: #111; --cell: #fff; --we: #f4f9fd;
             --line: 1.3px solid #333; --rad: 3px; --gap: 6px; --dayink: #111; --acc: #111; --hol-bg: #fff; }

    #print.th-warm   { --b1: #e9b8a0; --b2: #f0cfa0; --b3: #cfd9a8; --b4: #b9d3cf; --ink: #3a2a1d; --cell: #fffaf0; --we: #fbefd9; --line: 1px solid #e3d3b5; --rad: 9px; --gap: 5px; --dayink: #8a4b2a; --acc: #b5532a; }

    .pp { page-break-after: always; break-after: page; font-size: 12.5pt; color: var(--ink); }

  const put = (d, x, y) => { dots[d].style.transform = 'translate(' + x + 'px,' + y + 'px)'; };

// סימון חי על פריט שנמצא בעריכה (כתום) או במחיקה (אדום) עד שהשמירה מסתיימת
const BUSY_KIND = { edit_item: 'edit', edit_recurring: 'edit', cancel: 'edit', uncancel: 'edit', delete_item: 'del', delete_recurring: 'del' };
function markBusy(actions) {
  const els = [];
  actions.forEach(a => {
    const kind = BUSY_KIND[a.type], id = a.itemId || a.recurringId; if (!kind || !id) return;
    document.querySelectorAll('.item[data-id="' + CSS.escape(id) + '"]').forEach(el => {
      if ((a.type === 'cancel' || a.type === 'uncancel') && el.dataset.date !== a.date) return;
      el.classList.add('busy-' + kind); els.push(el);

  return () => els.forEach(el => el.classList.remove('busy-edit', 'busy-del'));
}

// ביטול הפעולה האחרונה: מחשבים פעולות הפוכות לפני השמירה, ושומרים אותן במכשיר
const UNDO_KEY = 'undoLast';
function undoGet() { try { const u = JSON.parse(localStorage.getItem(UNDO_KEY) || 'null'); return u && Date.now() - (u.ts || 0) < 30 * 60000 ? u : null; } catch (e) { return null; } }
function undoSet(v) { try { v ? localStorage.setItem(UNDO_KEY, JSON.stringify(v)) : localStorage.removeItem(UNDO_KEY); } catch (e) {} updateUndo(); }
function updateUndo() { const u = undoGet(), b = $('btnUndo'); if (!b) return; b.disabled = !(u && u.inv && u.inv.length); b.title = u && u.label ? 'ביטול: ' + u.label : 'אין מה לבטל'; }
function inverseOf(actions, before) {
  const inv = [];
  actions.forEach(a => {
    if (a.type === 'delete_item') { const o = before.items.find(i => i.id === a.itemId); if (o) inv.push({ type: 'add', date: o.date, person: o.person, title: o.title, time: o.time, remind: o.remind || 0 }); }
    else if (a.type === 'delete_recurring') { const o = before.recurring.find(r => r.id === a.recurringId); if (o) inv.push({ type: 'add_recurring', weekday: o.weekday, person: o.person, title: o.title, time: o.time, remind: o.remind || 0 }); }
    else if (a.type === 'edit_item') { const o = before.items.find(i => i.id === a.itemId); if (o) inv.push({ type: 'edit_item', itemId: o.id, date: o.date, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'edit_recurring') { const o = before.recurring.find(r => r.id === a.recurringId); if (o) inv.push({ type: 'edit_recurring', recurringId: o.id, weekday: o.weekday, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'cancel') inv.push({ type: 'uncancel', recurringId: a.recurringId, date: a.date });
    else if (a.type === 'uncancel') inv.push({ type: 'cancel', recurringId: a.recurringId, date: a.date });
  });
  return inv;
}
function inverseOfAdds(actions, before, after) {
  const inv = [];
  const newItems = after.items.filter(i => i.type === 'oneoff' && !before.items.some(o => o.id === i.id));
  const newRec = after.recurring.filter(r => !before.recurring.some(o => o.id === r.id));
  const nOne = actions.filter(a => a.type === 'add').length, nRec = actions.filter(a => a.type === 'add_recurring').length;
  if (nOne && newItems.length >= nOne) newItems.slice(-nOne).forEach(i => inv.push({ type: 'delete_item', itemId: i.id }));
  if (nRec && newRec.length >= nRec) newRec.slice(-nRec).forEach(r => inv.push({ type: 'delete_recurring', recurringId: r.id }));
  return inv;
}

async function save(actions, isUndo) {
  if (!actions.length) return false;
  showErr('');
  const before = DATA ? JSON.parse(JSON.stringify(DATA)) : null;
  const unmark = markBusy(actions);
  try {
    DATA = await call('applyActions', actions, { me: ME(), lines: actions.map(plain).filter(String), dates: affectedDates(actions) });
    unmark(); render();
    if (before && !isUndo) LAST_SAVED = { items: DATA.items.filter(i => i.type === 'oneoff' && !before.items.some(o => o.id === i.id)).map(i => i.id), rec: DATA.recurring.filter(r => !before.recurring.some(o => o.id === r.id)).map(r => r.id) };
    if (isUndo) undoSet(null);
    else if (before) { try { const inv = inverseOf(actions, before).concat(inverseOfAdds(actions, before, DATA)); undoSet(inv.length ? { ts: Date.now(), inv, label: actions.map(plain).filter(String).join(' · ').slice(0, 60) } : null); } catch (e) { undoSet(null); } }
    return true;
  }
  catch (e) { unmark(); showErr(e.message || String(e)); return false; }
}
$('btnUndo').onclick = async () => {
  const u = undoGet(); if (!u || !u.inv || !u.inv.length) return;
  // בודקים שהפריטים עדיין קיימים לפני שמבטלים
  const ok = u.inv.every(a => (a.itemId ? DATA.items.some(i => i.id === a.itemId) : true) && (a.type === 'edit_recurring' || a.type === 'delete_recurring' ? DATA.recurring.some(r => r.id === a.recurringId) : true));
  if (!ok) { undoSet(null); showErr('אי אפשר לבטל: משהו השתנה בינתיים.'); return; }
  const b = $('btnUndo'); b.disabled = true;
  await save(u.inv, true);
  updateUndo();
};

function pushSupported() { return STANDALONE && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.LUZ_VAPID; }
function pushHelp() {
  if (Notification.permission === 'denied' || PUSH_WHY === 'denied') return 'ההתראות חסומות בטלפון. כדי לאשר: הגדרות הטלפון, אפליקציות, "הלו"ז" (או Chrome), התראות, ולהפעיל. אחר כך לחזור ל-⚙️ וללחוץ הפעלה.';
  return 'לא הצלחתי להפעיל התראות' + (PUSH_WHY ? ' (' + PUSH_WHY.replace('err:', '') + ')' : '') + '. אפשר לנסות שוב בעוד רגע.';
}
function pushOn() { return pushSupported() && Notification.permission === 'granted'; }
function vapidKey() { const s = window.LUZ_VAPID.replace(/-/g, '+').replace(/_/g, '/'); const raw = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
let PUSH_WHY = '';

    if (!pushSupported() || !ME()) return false;

    if (Notification.permission !== 'granted') { if (silent) return false; if (await Notification.requestPermission() !== 'granted') { PUSH_WHY = 'denied'; return false; } }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey() });
    await callQuiet('savePush', ME(), sub.toJSON());
    return true;
  } catch (e) { PUSH_WHY = 'err:' + String((e && e.message) || e).slice(0, 120); return false; }
}
// שואלים פעם אחת אם להפעיל התראות (בכל מכשיר)
// שומר לשירות ההתראות את הקוד והשם, כדי שיוכל לשאול מה יש היום כשמגיעה התראה

const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function nextBday(b) {
  const [ty, tm, td] = DATA.today.split('-').map(Number);
  let y = ty; if (b.month < tm || (b.month === tm && b.day < td)) y++;
  const days = Math.round((Date.UTC(y, b.month - 1, b.day) - Date.UTC(ty, tm - 1, td)) / 86400000);
  return { days, turning: b.year ? y - b.year : 0 };
}
function bdayList() {
  const rows = (DATA.birthdays || []).map(b => ({ b, n: nextBday(b) })).sort((a, c) => a.n.days - c.n.days);
  const when = d => d === 0 ? 'היום!' : d === 1 ? 'מחר' : 'בעוד ' + d + ' ימים';
  openDlg('<h3>🎂 ימי הולדת</h3><div class="rec-list">' + (rows.length ? rows.map(({ b, n }) =>
    '<div class="rec-line"><span><b>' + esc(b.name) + '</b> · ' + b.day + ' ב' + MONTHS[b.month - 1] + (n.turning ? ' · גיל ' + n.turning : '') + '<br><small class="when' + (n.days <= 7 ? ' soon' : '') + '">' + when(n.days) + '</small></span><button class="btn small" data-bdel="' + esc(b.id) + '" aria-label="מחיקה">🗑️</button></div>').join('') : '<p class="note">עוד אין ימי הולדת. אפשר להוסיף למטה.</p>') +
    '</div><h4 class="dh">הוספה</h4><div class="form"><label>שם<input id="bName" placeholder="למשל: סבתא רותי"></label>' +
    '<div class="b3"><label>יום<select id="bDay">' + Array.from({ length: 31 }, (_, i) => '<option>' + (i + 1) + '</option>').join('') + '</select></label>' +
    '<label>חודש<select id="bMonth">' + MONTHS.map((m, i) => '<option value="' + (i + 1) + '">' + m + '</option>').join('') + '</select></label>' +
    '<label>שנת לידה (לא חובה)<input id="bYear" inputmode="numeric" placeholder="1985"></label></div></div>' +
    '<div class="row"><button class="btn primary" id="bAdd">הוספה</button><button class="btn" id="bClose">סגירה</button></div>' +
    '<details class="bulk"><summary>הוספת רשימה בבת אחת</summary><p class="note">שורה לכל אחד, שם ותאריך. למשל:<br><bdi dir="ltr">דני 3.4.1985</bdi> או <bdi dir="ltr">סבתא רותי 11.11</bdi></p><textarea id="bBulk" rows="5" placeholder="שם ותאריך בכל שורה"></textarea><div class="row"><button class="btn" id="bBulkGo">הוספת הרשימה</button></div><div id="bBulkMsg" class="note"></div></details>');
  $('bBulkGo').onclick = async () => {
    const lines = $('bBulk').value.split(/\n+/).map(x => x.trim()).filter(Boolean), acts = [], bad = [];
    lines.forEach(l => {
      const m = l.match(/^(.*?)[\s,:\-–]+(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\s*$/);
      if (!m || !m[1].trim()) { bad.push(l); return; }
      let y = m[4] ? +m[4] : 0; if (y && y < 100) y += y > 30 ? 1900 : 2000;
      const d = +m[2], mo = +m[3]; if (d < 1 || d > 31 || mo < 1 || mo > 12) { bad.push(l); return; }
      acts.push({ type: 'add_birthday', name: m[1].trim(), day: d, month: mo, year: y });
    });
    if (bad.length) { $('bBulkMsg').textContent = 'לא הבנתי את השורות האלה: ' + bad.join(' | ') + '. תקנו ונסו שוב.'; return; }
    if (!acts.length) return;

  dlg.querySelectorAll('[data-bdel]').forEach(x => x.onclick = async () => { closeDlg(); await save([{ type: 'delete_birthday', birthdayId: x.dataset.bdel }]); bdayList(); });
  $('bAdd').onclick = async () => {
    const name = $('bName').value.trim(); if (!name) { $('bName').focus(); return; }
    const y = parseInt($('bYear').value, 10);
    closeDlg(); await save([{ type: 'add_birthday', name, day: +$('bDay').value, month: +$('bMonth').value, year: y > 1900 && y < 2100 ? y : 0 }]); bdayList();
  };
}

  if (str === FAMILY) return DATA.people.slice();

  const known = DATA.people.filter(p => toks.includes(p));

    else if (JSON.stringify(d) !== JSON.stringify(DATA)) { DATA = d; render(); maybeShowNew(); }
    else saveCache();
  }).catch(e => { hideSplash(); if (!booted) { $('weeks').innerHTML = ''; } showErr(e.message || String(e)); });
}
</script>
</body>
