<style>

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Heebo, Arial, sans-serif; font-size: 16px; }
  button, input, select, textarea { font: inherit; }
  .app { max-width: 1400px; margin: 0 auto; padding: 12px 16px 60px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.small { padding: 5px 10px; font-size: 14px; }
  .btn.danger { color: var(--warn); }

  .input-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  .input-card textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
  .input-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }
  .confirm { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .confirm label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
  .confirm .dup { color: var(--warn); font-size: 13px; display: block; }
  .note { color: var(--muted); font-size: 14px; margin: 6px 0; }
  .dh { margin: 12px 0 4px; font-size: 16px; }
  .dh:first-child { margin-top: 0; }
  .crow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .crow input[type=checkbox] { margin-top: 5px; width: 18px; height: 18px; flex: none; }
  .cbody { flex: 1; min-width: 0; }
  .cbody .dup { color: var(--warn); font-size: 13px; display: block; }
  .erow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .erow .full { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .erow input, .erow select { border: 1px solid var(--line); border-radius: 8px; padding: 7px; min-width: 0; color: var(--ink); background: #fff; }
  .ms { color: var(--muted); font-size: 12px; margin-top: 8px; }
  dialog { max-height: 90vh; overflow: auto; }
  .answer { background: var(--today); border-radius: 10px; padding: 10px 12px; line-height: 1.6; }
  .day-h { cursor: pointer; }
  .err { color: var(--warn); font-size: 14px; margin-top: 8px; white-space: pre-wrap; }

  .week { margin-bottom: 22px; }
  .week h2 { font-size: 18px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  .week h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .days { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 900px) { .days { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 64px; }
  .day.today { background: var(--today); border-color: var(--accent); }
  .day.past { opacity: .55; }
  .day.fold { min-height: 0; padding: 5px 10px; }
  .day.fold .day-h { margin-bottom: 0; }
  .day-h { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .day-h b { font-size: 15px; }
  .day-h span { color: var(--muted); font-size: 13px; }
  .hol { background: var(--hol-bg); color: var(--hol); border-radius: 6px; padding: 0 6px; font-size: 12px; }
  .item { display: block; width: 100%; text-align: right; background: none; border: 0; padding: 3px 0; cursor: pointer; line-height: 1.35; color: inherit; }
  .item:hover { background: #f1f1ee; }
  .item .who { font-weight: 700; }
  .item .t { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .item.one { background: var(--star-bg); border-radius: 6px; padding: 3px 5px; margin: 2px 0; }
  .item.one::before { content: "★ "; color: var(--star); }
  #btnUndo:disabled { opacity: .35; cursor: default; }
  .item.off { text-decoration: line-through; color: var(--muted); }
  .item.busy-edit, .item.busy-del { position: relative; border-radius: 8px; animation: busyGlow 1.2s ease-in-out infinite; background: linear-gradient(100deg, transparent 30%, var(--busy-sh) 50%, transparent 70%) 0 0/250% 100% no-repeat, var(--busy-bg); }
  .item.busy-edit { --busy: #f08c00; --busy-bg: rgba(240,140,0,.08); --busy-sh: rgba(240,140,0,.28); }
  .item.busy-del  { --busy: #e03131; --busy-bg: rgba(224,49,49,.07); --busy-sh: rgba(224,49,49,.25); }
  @keyframes busyGlow { 0% { box-shadow: 0 0 0 1.5px var(--busy); background-position: 130% 0, 0 0; } 50% { box-shadow: 0 0 0 3px var(--busy), 0 0 10px var(--busy); } 100% { box-shadow: 0 0 0 1.5px var(--busy); background-position: -30% 0, 0 0; } }
  @media (prefers-reduced-motion: reduce) { .item.busy-edit, .item.busy-del { animation: none; box-shadow: 0 0 0 2px var(--busy); } }
  .empty { color: var(--muted); font-size: 13px; }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 10px; font-size: 18px; }
  .dlg-actions { display: flex; flex-direction: column; gap: 8px; }
  .form { display: grid; gap: 8px; }
  .form label { display: grid; gap: 3px; font-size: 14px; color: var(--muted); }
  .form input, .form select { border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: var(--ink); }
  .row { display: flex; gap: 8px; justify-content: flex-start; margin-top: 12px; }
  .rec-list { max-height: 60vh; overflow: auto; }
  .rec-list h4 { margin: 10px 0 4px; font-size: 15px; }
  .rec-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }

  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 6px; padding: 8px 0; margin-bottom: 8px; overflow-x: auto; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; font-size: 15px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .tab small { opacity: .75; font-size: 12px; margin-inline-start: 4px; }
  @media (max-width: 560px) { .tab { flex: 1 1 0; padding: 6px 2px; font-size: 13px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; } .tab small { margin: 0; font-size: 11px; } }
  .mic { position: fixed; bottom: 20px; left: 20px; width: var(--mic, 54px); height: var(--mic, 54px); border-radius: 50%; border: 0; background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; z-index: 20; display: grid; place-items: center; }
  .mic svg { width: 44%; height: 44%; }
  .opt { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 14px; }
  .opt button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .mic.rec { background: #dc2626; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); } 100% { box-shadow: 0 0 0 18px rgba(220,38,38,0); } }
  .listening { position: fixed; bottom: 96px; left: 12px; right: 12px; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; z-index: 30; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
  .lis-h { display: flex; align-items: center; gap: 8px; }
  .lis-h b { flex: 1; font-size: 16px; }
  .lis-h .x { border: 0; background: #f1f1ee; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
  .lis-dot { width: 12px; height: 12px; border-radius: 50%; background: #9ca3af; }
  .lis-dot.live { background: #dc2626; animation: pulse 1.2s infinite; }
  .lis-t { min-height: 3.2em; margin: 8px 0; font-size: 19px; line-height: 1.5; }
  .lis-t .interim { color: var(--muted); }
  .lis-s { color: var(--muted); font-size: 11px; direction: ltr; text-align: left; margin-bottom: 6px; word-break: break-all; }
  .lis-r { display: flex; gap: 8px; }
  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 9mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { background: #fff; }
    .app, dialog, .mic, .listening { display: none !important; }
    #print { display: block; }

    /* ---- theme variables (default = excel) ---- */
    #print { --b1: #8fd3f4; --b2: #fbd3b0; --b3: #c4e5b5; --b4: #fbe8a0; --ink: #111; --cell: #fff; --we: #f4f9fd;
             --line: 1.3px solid #333; --rad: 3px; --gap: 6px; --dayink: #111; --acc: #111; --hol-bg: #fff; }
    #print.th-pastel { --b1: #bcdcf5; --b2: #f7cdd8; --b3: #cfe8d2; --b4: #fde7a8; --line: 0 solid transparent; --rad: 10px; --gap: 5px; --dayink: #333; --acc: #b3402a; --we: #fff; --cell: #fff; }
    #print.th-clean  { --b1: #2b6cb0; --b2: #2b6cb0; --b3: #2b6cb0; --b4: #2b6cb0; --ink: #1a1a1a; --cell: #fff; --we: #f3f4f6; --line: 0 solid transparent; --rad: 0; --gap: 0px; --dayink: #1f4e8c; --acc: #1f4e8c; }
    #print.th-warm   { --b1: #e9b8a0; --b2: #f0cfa0; --b3: #cfd9a8; --b4: #b9d3cf; --ink: #3a2a1d; --cell: #fffaf0; --we: #fbefd9; --line: 1px solid #e3d3b5; --rad: 9px; --gap: 5px; --dayink: #8a4b2a; --acc: #b5532a; }

    .pp { page-break-after: always; break-after: page; font-size: 12.5pt; color: var(--ink); }
    .pp:last-child { page-break-after: auto; break-after: auto; }
    .pp h1, .pp h2 { margin: 0 0 4px; padding: 5px 12px; font-weight: 700; border-radius: var(--rad); background: var(--bar); color: #111; border: var(--line); }
    #print.th-clean .pp h1, #print.th-clean .pp h2 { background: none; color: var(--dayink); border-radius: 0; border: 0; border-bottom: 3px solid var(--dayink); padding-inline: 0; }
    .pp h1 { font-size: 17pt; } .pp h2 { font-size: 13pt; }
    .pp.w1 { --bar: var(--b1); } .pp.w2 { --bar: var(--b2); } .pp.w3 { --bar: var(--b3); } .pp.w4 { --bar: var(--b4); }
    .pp .two > div:nth-child(1) { --bar: var(--b3); } .pp .two > div:nth-child(2) { --bar: var(--b4); }

    .pp table { width: 100%; border-collapse: separate; border-spacing: 0 var(--gap); }
    .pp td { vertical-align: top; padding: 6px 10px; background: var(--cell); border-top: var(--line); border-bottom: var(--line); }
    .pp td:first-child { border-inline-start: var(--line); border-start-start-radius: var(--rad); border-end-start-radius: var(--rad); }
    .pp td:last-child { border-inline-end: var(--line); border-start-end-radius: var(--rad); border-end-end-radius: var(--rad); }
    .pp tr.we td { background: var(--we); }

    .pp td.d b { display: block; font-size: 1.05em; }

    .pp .li.one { font-weight: 700; }
    .pp .li.one::before { content: "★ "; color: var(--acc); }
    .pp .li.off { text-decoration: line-through; color: #777; }

    /* theme specifics */
    #print.th-pastel tr.d0 td { background: #fff0e6; } #print.th-pastel tr.d1 td { background: #eaf6ee; } #print.th-pastel tr.d2 td { background: #eaf2fb; }
    #print.th-pastel tr.d3 td { background: #f5eefa; } #print.th-pastel tr.d4 td { background: #fff8e1; } #print.th-pastel tr.d5 td { background: #fde8ef; } #print.th-pastel tr.d6 td { background: #eceff1; }
    #print.th-clean td { border-bottom: 0.8px solid #cfcfcf; border-top: 0; }

    #print.th-clean td:first-child, #print.th-clean td:last-child { border-inline: 0; }

  #dlg[data-locked] { border:3px solid #d93025; }

// ---------- dates ----------
function addDays(ds, n) { const [y,m,d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }
function dow(ds) { const [y,m,d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)).getUTCDay(); }
function rangeLabel(ws) {
  const we = addDays(ws, 6), [, m1, d1] = ws.split('-').map(Number), [, m2, d2] = we.split('-').map(Number);
  return m1 === m2 ? d1 + '-' + d2 + '.' + m1 : d1 + '.' + m1 + '-' + d2 + '.' + m2;
}
function short(ds) { const [, m, d] = ds.split('-').map(Number); return d + '.' + m; }
function windowStart(today) {
  // השבוע הקרוב מתחיל ביום ראשון. בשבת כבר מציגים את השבוע הבא.

}

// ---------- model ----------
function dayEntries(ds) {
  const w = dow(ds);
  const cancels = new Set(DATA.items.filter(i => i.type === 'cancel' && i.date === ds).map(i => i.recurringId));
  const rec = DATA.recurring.filter(r => r.weekday === w).map(r => ({ kind: 'rec', id: r.id, person: r.person, title: r.title, time: r.time, off: cancels.has(r.id), date: ds, by: r.by, ts: r.ts }));
  const one = DATA.items.filter(i => i.type === 'oneoff' && i.date === ds).map(i => ({ kind: 'one', id: i.id, person: i.person, title: i.title, time: i.time, date: ds, by: i.by, ts: i.ts }));
  return rec.concat(one).sort((a, b) => timeKey(a.time) - timeKey(b.time));
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}

// ---------- agenda (sent to the model so it can answer questions) ----------
function agendaText(days) {
  const out = [];
  for (let i = 0; i < days; i++) {
    const ds = addDays(DATA.today, i);
    const hol = (HOL[ds] || []).join(', ');
    const ents = dayEntries(ds).map(e => (e.person ? e.person + ' ' : '') + e.title + (e.time ? ' ' + e.time : '') + (e.off ? ' [לא מתקיים]' : '') + (e.kind === 'one' ? ' (חד־פעמי)' : '')).join('; ');
    out.push(ds + ' יום ' + DAYS[dow(ds)] + (hol ? ' [' + hol + ']' : '') + ': ' + (ents || 'אין'));
  }
  return out.join('\n');
}

const WEEK_NAMES = ['השבוע הקרוב', 'שבוע הבא', 'עוד שבועיים', 'עוד שלושה שבועות'];

let WEEK = 0;
const PAST_OPEN = new Set();
function render() {
  const start = windowStart(DATA.today);
  $('tabs').innerHTML = TAB_NAMES.map((n, i) => '<button class="tab' + (i === WEEK ? ' on' : '') + '" data-w="' + i + '">' + n + '<small><bdi dir="ltr">' + rangeLabel(addDays(start, i * 7)) + '</bdi></small></button>').join('');
  let html = '';
  for (let w = WEEK; w <= WEEK; w++) {
    const ws = addDays(start, w * 7);
    html += '<section class="week"><h2>' + WEEK_NAMES[w] + ' <small><bdi dir="ltr">' + rangeLabel(ws) + '</bdi></small></h2><div class="days">';
    for (let d = 0; d < 7; d++) {
      const ds = addDays(ws, d);
      const isPast = ds < DATA.today;
      const fold = isPast && !PAST_OPEN.has(ds);
      const cls = ds === DATA.today ? ' today' : (isPast ? ' past' : '') + (fold ? ' fold' : '');
      const hol = (HOL[ds] || []).map(h => '<span class="hol">' + esc(h) + '</span>').join(' ');
      const ents = dayEntries(ds);
      html += '<div class="day' + cls + '" id="d-' + ds + '"><div class="day-h"><b>' + DAYS[d] + '</b><span>' + short(ds) + '</span>' + (fold ? '<span>· ' + (ents.length ? ents.length + ' פריטים' : 'ריק') + ' ▾</span>' : hol) + '</div>';

// מריץ בקשה עם ביטול ידני ו־timeout. תשובה שמגיעה אחרי ביטול מתעלמת.
function runCancelable(promise, ms) {
  const my = ++RUN;
  return new Promise((res, rej) => {
    const t = setTimeout(() => { if (my === RUN) { RUN++; rej(new Error('זה לוקח יותר מדי זמן. אפשר לנסות שוב.')); } }, ms || 60000);
    CANCEL = () => { clearTimeout(t); if (my === RUN) { RUN++; rej(new Error('__cancel__')); } };
    promise.then(v => { clearTimeout(t); if (my === RUN) res(v); }, e => { clearTimeout(t); if (my === RUN) rej(e); });
  });
}

async function submitText() {
  const text = $('txt').value.trim();
  if (!text) return;
  showErr(''); busy(true, 'מבין…');
  try { showConfirm(await runCancelable(call('parseInput', text, '', '', agendaText(looksLikeQuestion(text) ? 60 : 21)))); }
  catch (e) { if (e.message !== '__cancel__') showErr(e.message || String(e)); }
  finally { busy(false); }
}

async function submitPhoto(file) {
  showErr(''); busy(true, 'קורא את התמונה…');
  try {
    const { data, mime } = await shrinkImage(file);
    showConfirm(await runCancelable(call('parseInput', $('txt').value.trim(), data, mime, agendaText(21)), 90000));
  } catch (e) { if (e.message !== '__cancel__') showErr(e.message || String(e)); }
  finally { busy(false); $('file').value = ''; }
}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({ data: c.toDataURL('image/jpeg', 0.85).split(',')[1], mime: 'image/jpeg' });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error('לא הצלחתי לפתוח את התמונה'));
    img.src = URL.createObjectURL(file);
  });
}

  const t = norm(a.title);
  const goingOff = new Set((batch || []).filter(b => b.type === 'cancel' && b.date === a.date).map(b => b.recurringId));
  return dayEntries(a.date).some(e => !e.off && !(e.kind === 'rec' && goingOff.has(e.id)) && (norm(e.title).includes(t) || t.includes(norm(e.title))) && (!a.person || !e.person || a.person === e.person));
}
function valid(a) {
  if (a.type === 'add') return /^\d{4}-\d{2}-\d{2}$/.test(a.date || '') && a.title;
  if (a.type === 'add_recurring') return a.weekday >= 0 && a.weekday <= 6 && a.title;
  if (a.type === 'cancel') return a.date && DATA.recurring.some(r => r.id === a.recurringId);
  if (a.type === 'delete_item') return DATA.items.some(i => i.id === a.itemId);
  if (a.type === 'delete_recurring') return DATA.recurring.some(r => r.id === a.recurringId);
  return false;
}

function collectEdits() {

function plain(a) {
  const who = (a.person ? a.person + ' ' : '');
  const tm = a.time ? ' ' + a.time : '';
  const dayOf = d => DAYS[dow(d)] + ' ' + short(d);
  if (a.type === 'add') return 'נוסף: ' + who + a.title + tm + ' (' + dayOf(a.date) + ')';
  if (a.type === 'add_recurring') return 'נוסף קבוע: ' + who + a.title + tm + ' (כל יום ' + DAYS[a.weekday] + ')';
  if (a.type === 'cancel') { const r = DATA.recurring.find(x => x.id === a.recurringId); return 'בוטל: ' + (r ? (r.person ? r.person + ' ' : '') + r.title : 'פריט קבוע') + ' (' + dayOf(a.date) + ')'; }
  if (a.type === 'uncancel') { const r = DATA.recurring.find(x => x.id === a.recurringId); return 'חזר להתקיים: ' + (r ? r.title : 'פריט קבוע') + ' (' + dayOf(a.date) + ')'; }
  if (a.type === 'delete_item') { const i = DATA.items.find(x => x.id === a.itemId); return i ? 'הוסר: ' + (i.person ? i.person + ' ' : '') + i.title + ' (' + dayOf(i.date) + ')' : ''; }
  if (a.type === 'delete_recurring') { const r = DATA.recurring.find(x => x.id === a.recurringId); return r ? 'הוסר קבוע: ' + (r.person ? r.person + ' ' : '') + r.title : ''; }
  if (a.type === 'edit_item') return 'עודכן: ' + who + a.title + tm + (a.date ? ' (' + dayOf(a.date) + ')' : '');
  if (a.type === 'edit_recurring') return 'עודכן קבוע: ' + who + a.title + tm + ' (כל יום ' + DAYS[a.weekday] + ')';
  return '';
}
function affectedDates(chosen) {
  const set = new Set();
  chosen.forEach(a => {
    if (a.type === 'add' || a.type === 'cancel') set.add(a.date);
    else if (a.type === 'add_recurring') set.add(nextDate(a.weekday));
    else if (a.type === 'edit_item' && a.date) set.add(a.date);
    else if (a.type === 'uncancel') set.add(a.date);
    else if (a.type === 'delete_item') { const i = DATA.items.find(x => x.id === a.itemId); if (i) set.add(i.date); }
  });
  return [...set].sort();
}

async function doConfirm() {

// סימון חי על פריט שנמצא בעריכה (כתום) או במחיקה (אדום) עד שהשמירה מסתיימת
const BUSY_KIND = { edit_item: 'edit', edit_recurring: 'edit', cancel: 'edit', uncancel: 'edit', delete_item: 'del', delete_recurring: 'del' };
function markBusy(actions) {
  const els = [];
  actions.forEach(a => {
    const kind = BUSY_KIND[a.type], id = a.itemId || a.recurringId; if (!kind || !id) return;
    document.querySelectorAll('.item[data-id="' + CSS.escape(id) + '"]').forEach(el => {
      if ((a.type === 'cancel' || a.type === 'uncancel') && el.dataset.date !== a.date) return;
      el.classList.add('busy-' + kind); els.push(el);
    });
  });
  return () => els.forEach(el => el.classList.remove('busy-edit', 'busy-del'));
}

// ביטול הפעולה האחרונה: מחשבים פעולות הפוכות לפני השמירה, ושומרים אותן במכשיר
const UNDO_KEY = 'undoLast';
function undoGet() { try { const u = JSON.parse(localStorage.getItem(UNDO_KEY) || 'null'); return u && Date.now() - (u.ts || 0) < 30 * 60000 ? u : null; } catch (e) { return null; } }
function undoSet(v) { try { v ? localStorage.setItem(UNDO_KEY, JSON.stringify(v)) : localStorage.removeItem(UNDO_KEY); } catch (e) {} updateUndo(); }
function updateUndo() { const u = undoGet(), b = $('btnUndo'); if (!b) return; b.disabled = !(u && u.inv && u.inv.length); b.title = u && u.label ? 'ביטול: ' + u.label : 'אין מה לבטל'; }
function inverseOf(actions, before) {
  const inv = [];
  actions.forEach(a => {
    if (a.type === 'delete_item') { const o = before.items.find(i => i.id === a.itemId); if (o) inv.push({ type: 'add', date: o.date, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'delete_recurring') { const o = before.recurring.find(r => r.id === a.recurringId); if (o) inv.push({ type: 'add_recurring', weekday: o.weekday, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'edit_item') { const o = before.items.find(i => i.id === a.itemId); if (o) inv.push({ type: 'edit_item', itemId: o.id, date: o.date, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'edit_recurring') { const o = before.recurring.find(r => r.id === a.recurringId); if (o) inv.push({ type: 'edit_recurring', recurringId: o.id, weekday: o.weekday, person: o.person, title: o.title, time: o.time }); }
    else if (a.type === 'cancel') inv.push({ type: 'uncancel', recurringId: a.recurringId, date: a.date });
    else if (a.type === 'uncancel') inv.push({ type: 'cancel', recurringId: a.recurringId, date: a.date });
  });
  return inv;
}
function inverseOfAdds(actions, before, after) {
  const inv = [];
  const newItems = after.items.filter(i => i.type === 'oneoff' && !before.items.some(o => o.id === i.id));
  const newRec = after.recurring.filter(r => !before.recurring.some(o => o.id === r.id));
  const nOne = actions.filter(a => a.type === 'add').length, nRec = actions.filter(a => a.type === 'add_recurring').length;
  if (nOne && newItems.length >= nOne) newItems.slice(-nOne).forEach(i => inv.push({ type: 'delete_item', itemId: i.id }));
  if (nRec && newRec.length >= nRec) newRec.slice(-nRec).forEach(r => inv.push({ type: 'delete_recurring', recurringId: r.id }));
  return inv;
}

async function save(actions, isUndo) {
  if (!actions.length) return false;
  showErr('');
  const before = DATA ? JSON.parse(JSON.stringify(DATA)) : null;
  const unmark = markBusy(actions);
  try {
    DATA = await call('applyActions', actions, { me: ME(), lines: actions.map(plain).filter(String), dates: affectedDates(actions) });
    unmark(); render();
    if (isUndo) undoSet(null);
    else if (before) { try { const inv = inverseOf(actions, before).concat(inverseOfAdds(actions, before, DATA)); undoSet(inv.length ? { ts: Date.now(), inv, label: actions.map(plain).filter(String).join(' · ').slice(0, 60) } : null); } catch (e) { undoSet(null); } }
    return true;
  }
  catch (e) { unmark(); showErr(e.message || String(e)); return false; }
}
$('btnUndo').onclick = async () => {
  const u = undoGet(); if (!u || !u.inv || !u.inv.length) return;
  // בודקים שהפריטים עדיין קיימים לפני שמבטלים
  const ok = u.inv.every(a => (a.itemId ? DATA.items.some(i => i.id === a.itemId) : true) && (a.type === 'edit_recurring' || a.type === 'delete_recurring' ? DATA.recurring.some(r => r.id === a.recurringId) : true));
  if (!ok) { undoSet(null); showErr('אי אפשר לבטל: משהו השתנה בינתיים.'); return; }
  const b = $('btnUndo'); b.disabled = true;
  await save(u.inv, true);
  updateUndo();
};

// ---------- התראות (Web Push) ----------
function pushSupported() { return STANDALONE && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.LUZ_VAPID; }
function pushOn() { return pushSupported() && Notification.permission === 'granted'; }
function vapidKey() { const s = window.LUZ_VAPID.replace(/-/g, '+').replace(/_/g, '/'); const raw = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function enablePush(silent) {
  try {
    if (!pushSupported() || !ME()) return false;
    if (Notification.permission !== 'granted') { if (silent) return false; if (await Notification.requestPermission() !== 'granted') return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey() });
    await call('savePush', ME(), sub.toJSON());
    return true;
  } catch (e) { return false; }
}
// שואלים פעם אחת אם להפעיל התראות (בכל מכשיר)
// שומר לשירות ההתראות את הקוד והשם, כדי שיוכל לשאול מה יש היום כשמגיעה התראה
function saveCfg() { try { if (STANDALONE && 'caches' in window && ME() && K) caches.open('cfg').then(c => c.put('cfg', new Response(JSON.stringify({ k: K, me: ME() })))); } catch (e) {} }
function maybeAskPush() {
  saveCfg();
  if (!pushSupported() || !ME() || dlg.open) return;
  if (Notification.permission === 'granted') { enablePush(true); return; }
  let asked = false; try { asked = !!localStorage.getItem('pushAsked'); } catch (e) {}
  if (asked || Notification.permission === 'denied') return;
  try { localStorage.setItem('pushAsked', '1'); } catch (e) {}
  openDlg('<h3>🔔 לקבל התראה כשיש עדכון?</h3><p>כשמישהו אחר מוסיף או משנה משהו בלו"ז, תקפוץ בטלפון הודעה "יש עדכון חדש בלו"ז". בלי פרטים ובלי רעש מיותר.</p><div class="row"><button class="btn primary" id="pYes">כן, להפעיל</button><button class="btn" id="pNo">לא עכשיו</button></div><p style="color:var(--muted);font-size:13px">אפשר לשנות אחר כך ב-⚙️.</p>');
  $('pYes').onclick = async () => { closeDlg(); if (!(await enablePush())) showErr('ההתראות לא הופעלו. אפשר לנסות שוב ב-⚙️.'); };
  $('pNo').onclick = closeDlg;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';

function lis(html) { const l = $('listening'); l.hidden = false; l.innerHTML = html; }

function vDbg(ev) { V.log.push(ev); }
function vRender() {
  const final = V.final, interim = V.interim;
  lis('<div class="lis-h"><span class="lis-dot' + (V.live ? ' live' : '') + '"></span><b>' + esc(V.state) + '</b><button class="x" id="lisX" aria-label="ביטול">✕</button></div>' +

    '<div class="lis-r">' + (V.ended ? '<button class="btn primary" id="lisAgain">לנסות שוב</button>' : '<button class="btn primary" id="lisDone">סיום ושליחה</button>') + '</div>');
  $('lisX').onclick = voiceCancel;
  if ($('lisDone')) $('lisDone').onclick = () => voiceStop(true);
  if ($('lisAgain')) $('lisAgain').onclick = () => { lisHide(); voiceStart(); };
}
function vTimers(silenceMs) {
  clearTimeout(V.tSil); V.tSil = setTimeout(() => voiceStop(true), silenceMs);
}
function voiceCancel() { if (REC) { V.send = false; try { REC.abort(); } catch (e) {} } cleanupVoice(); lisHide(); }
function cleanupVoice() { if (V) { clearTimeout(V.tSil); clearTimeout(V.tMax); } REC = null; setMic(false); }

function voiceStart() {
  if (!SR) { V = { state: 'הדפדפן לא תומך בהקלטה כאן. אפשר ללחוץ על המיקרופון שבמקלדת.', final: '', interim: '', log: ['no-SpeechRecognition'], ended: true }; vRender(); $('txt').focus(); return; }
  V = { state: 'מבקש גישה למיקרופון…', final: '', interim: '', log: [], live: false, send: true, ended: false };
  REC = new SR();
  REC.lang = 'he-IL'; REC.interimResults = true; REC.continuous = false; REC.maxAlternatives = 1;
  setMic(true); vRender();
  V.tSil = setTimeout(() => voiceStop(true), 9000);        // לא נשמע כלום
  V.tMax = setTimeout(() => voiceStop(true), 45000);       // תקרה
  REC.onstart = () => { V.state = 'מקשיב… אפשר לדבר'; V.live = true; vDbg('start'); vRender(); };
  REC.onaudiostart = () => vDbg('audio');
  REC.onspeechstart = () => { V.state = 'שומע אותך…'; vDbg('speech'); vRender(); };
  REC.onresult = e => {
    let fin = '', inter = '';
    for (let i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) fin += e.results[i][0].transcript; else inter += e.results[i][0].transcript; }
    V.final = fin; V.interim = inter; vDbg('result'); vRender(); vTimers(2200);
  };
  REC.onerror = e => {
    const msgs = { 'not-allowed': 'אין הרשאה למיקרופון בדף הזה', 'service-not-allowed': 'אין הרשאה לשירות הזיהוי בדף הזה', 'no-speech': 'לא שמעתי כלום', 'audio-capture': 'לא נמצא מיקרופון', 'network': 'אין חיבור לשירות הזיהוי', 'language-not-supported': 'עברית לא נתמכת כאן' };

  };

    vDbg('end');
    const t = (V.final + ' ' + V.interim).trim(), send = V.send, errored = V.errored;
    cleanupVoice(); V.live = false;
    if (send && t) {
      lisHide();
      $('txt').value = ($('txt').value.trim() ? $('txt').value.trim() + ' ' : '') + t;
      window.scrollTo({ top: 0, behavior: 'smooth' });

    } else if (!errored && send) { V.state = 'לא שמעתי כלום'; V.ended = true; vRender(); }
    else if (errored) { V.ended = true; vRender(); }
  };
  try { REC.start(); } catch (err) { V.state = 'לא הצלחתי להפעיל את ההקלטה'; V.log.push('start-failed:' + err.name); V.ended = true; cleanupVoice(); vRender(); }
}

(function () {
  const m = $('mic'); let st = null, moved = false;
  function place(x, y) {
    const w = m.offsetWidth, h = m.offsetHeight;
    x = Math.max(4, Math.min(window.innerWidth - w - 4, x)); y = Math.max(4, Math.min(window.innerHeight - h - 4, y));
    m.style.left = x + 'px'; m.style.top = y + 'px'; m.style.right = 'auto'; m.style.bottom = 'auto';
    return { x: x / window.innerWidth, y: y / window.innerHeight };
  }
  try { const p = JSON.parse(localStorage.getItem('micPos') || 'null'); if (p) place(p.x * window.innerWidth, p.y * window.innerHeight); } catch (e) {}
  m.style.touchAction = 'none';
  m.addEventListener('pointerdown', e => { const r = m.getBoundingClientRect(); st = { dx: e.clientX - r.left, dy: e.clientY - r.top, x0: e.clientX, y0: e.clientY }; moved = false; try { m.setPointerCapture(e.pointerId); } catch (er) {} });
  m.addEventListener('pointermove', e => {
    if (!st) return;
    if (!moved && Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 10) return;
    moved = true; const pos = place(e.clientX - st.dx, e.clientY - st.dy);
    try { localStorage.setItem('micPos', JSON.stringify(pos)); } catch (er) {}
  });
  m.addEventListener('pointerup', () => { st = null; });
  m.addEventListener('pointercancel', () => { st = null; });
  m.addEventListener('click', e => { if (moved) { moved = false; e.preventDefault(); return; } toggleMic(); });
})();

    if (act) {
      history.replaceState(null, '', location.pathname + location.search.replace(/[?&]a=[^&]*/, '').replace(/^&/, '?'));
      if (ME() && !dlg.open) {
        if (act === 'today') showDay(DATA.today);
        else if (act === 'voice') setTimeout(toggleMic, 300);
        else if (act === 'share') receiveShare();
      }
    }
  } catch (e) {}
  const t = document.getElementById('d-' + d.today);
  if (t && window.innerWidth < 900) t.scrollIntoView({ block: 'center' });
}).catch(e => { $('weeks').innerHTML = ''; showErr(e.message || String(e)); });
</script>
</body>
